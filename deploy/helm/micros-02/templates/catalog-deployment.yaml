apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "micros-02.catalogName" . }}
  labels:
    {{- include "micros-02.labels" . | nindent 4 }}
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/component: api

spec:
  replicas: {{ .Values.catalog.replicaCount }}

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-service
      app.kubernetes.io/component: api
      app.kubernetes.io/instance: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-service
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: micros-02-two-services-over-http
        app.kubernetes.io/instance: {{ .Release.Name }}

    spec:
      containers:
        - name: catalog-service

          image: "{{ .Values.catalog.image.repository }}:{{ .Values.catalog.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.catalog.service.targetPort }}
              protocol: TCP

          envFrom:
            - configMapRef:
                name: {{ include "micros-02.catalogName" . }}-config

          env:
            - name: CATALOG_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.catalog.database.secretName }}
                  key: postgres-database

            - name: CATALOG_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.catalog.database.secretName }}
                  key: postgres-username

            - name: CATALOG_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.catalog.database.secretName }}
                  key: postgres-password

            - name: ConnectionStrings__CatalogDatabase
              value: >-
                Host={{ include "micros-02.catalogDbName" . }};
                Port=5432;
                Database=$(CATALOG_DATABASE_NAME);
                Username=$(CATALOG_DATABASE_USERNAME);
                Password=$(CATALOG_DATABASE_PASSWORD)

          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3

          resources:
            {{- toYaml .Values.catalog.resources | nindent 12 }}