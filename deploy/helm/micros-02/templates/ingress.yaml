{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ printf "%s-api" .Release.Name | trunc 63 | trimSuffix "-" }}

  labels:
    {{- include "micros-02.labels" . | nindent 4 }}
    app.kubernetes.io/name: micros-02-api
    app.kubernetes.io/component: ingress

  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  ingressClassName: {{ .Values.ingress.className | quote }}

  rules:
    - http:
        paths:
          - path: {{ .Values.ingress.paths.catalog | quote }}
            pathType: Prefix

            backend:
              service:
                name: {{ include "micros-02.catalogName" . }}

                port:
                  number: {{ .Values.catalog.service.port }}

          - path: {{ .Values.ingress.paths.pricing | quote }}
            pathType: Prefix

            backend:
              service:
                name: {{ include "micros-02.pricingName" . }}

                port:
                  number: {{ .Values.pricing.service.port }}
{{- end }}