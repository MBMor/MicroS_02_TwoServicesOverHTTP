apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: {{ include "micros-02.catalogDbName" . }}
  labels:
    {{- include "micros-02.labels" . | nindent 4 }}
    app.kubernetes.io/name: catalog-service-db
    app.kubernetes.io/component: database

spec:
  serviceName: {{ include "micros-02.catalogDbHeadlessName" . }}
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-service-db
      app.kubernetes.io/component: database
      app.kubernetes.io/instance: {{ .Release.Name }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-service-db
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: micros-02-two-services-over-http
        app.kubernetes.io/instance: {{ .Release.Name }}

    spec:
      terminationGracePeriodSeconds: 60

      containers:
        - name: postgres

          image: "{{ .Values.catalog.database.image.repository }}:{{ .Values.catalog.database.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}

          ports:
            - name: postgresql
              containerPort: {{ .Values.catalog.database.service.port }}
              protocol: TCP

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.catalog.database.secretName }}
                  key: postgres-database

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.catalog.database.secretName }}
                  key: postgres-username

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.catalog.database.secretName }}
                  key: postgres-password

          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >
                  pg_isready
                  --host=127.0.0.1
                  --port={{ .Values.catalog.database.service.port }}
                  --username="$POSTGRES_USER"
                  --dbname="$POSTGRES_DB"
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >
                  pg_isready
                  --host=127.0.0.1
                  --port={{ .Values.catalog.database.service.port }}
                  --username="$POSTGRES_USER"
                  --dbname="$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >
                  pg_isready
                  --host=127.0.0.1
                  --port={{ .Values.catalog.database.service.port }}
                  --username="$POSTGRES_USER"
                  --dbname="$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          resources:
            {{- toYaml .Values.catalog.database.resources | nindent 12 }}

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql

  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: catalog-service-db
          app.kubernetes.io/component: database
          app.kubernetes.io/part-of: micros-02-two-services-over-http
          app.kubernetes.io/instance: {{ .Release.Name }}

      spec:
        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: {{ .Values.catalog.database.persistence.size }}