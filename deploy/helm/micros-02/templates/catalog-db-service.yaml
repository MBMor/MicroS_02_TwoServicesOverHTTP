apiVersion: v1
kind: Service

metadata:
  name: {{ include "micros-02.catalogDbHeadlessName" . }}
  labels:
    {{- include "micros-02.labels" . | nindent 4 }}
    app.kubernetes.io/name: catalog-service-db
    app.kubernetes.io/component: database

spec:
  clusterIP: None

  selector:
    app.kubernetes.io/name: catalog-service-db
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: {{ .Release.Name }}

  ports:
    - name: postgresql
      protocol: TCP
      port: {{ .Values.catalog.database.service.port }}
      targetPort: postgresql

---
apiVersion: v1
kind: Service

metadata:
  name: {{ include "micros-02.catalogDbName" . }}
  labels:
    {{- include "micros-02.labels" . | nindent 4 }}
    app.kubernetes.io/name: catalog-service-db
    app.kubernetes.io/component: database

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: catalog-service-db
    app.kubernetes.io/component: database
    app.kubernetes.io/instance: {{ .Release.Name }}

  ports:
    - name: postgresql
      protocol: TCP
      port: {{ .Values.catalog.database.service.port }}
      targetPort: postgresql