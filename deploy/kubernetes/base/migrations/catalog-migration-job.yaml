apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-database-migration
  namespace: micros-02-qa
  labels:
    app.kubernetes.io/name: catalog-database-migration
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: micros-02-two-services-over-http
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-database-migration
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: micros-02-two-services-over-http
    spec:
      restartPolicy: Never

      containers:
        - name: migration
          image: micros-02/ef-migrations:1.0.0
          imagePullPolicy: IfNotPresent
          args:
            - database
            - update
            - --project
            - src/CatalogService/CatalogService.Infrastructure/CatalogService.Infrastructure.csproj
            - --startup-project
            - src/CatalogService/CatalogService.Api/CatalogService.Api.csproj
            - --context
            - CatalogDbContext
            - --configuration
            - Release
            - --no-build
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: catalog-service-config
                  key: ASPNETCORE_ENVIRONMENT

            - name: PricingService__BaseUrl
              valueFrom:
                configMapKeyRef:
                  name: catalog-service-config
                  key: PricingService__BaseUrl
            - name: PricingService__TimeoutSeconds
              valueFrom:
                configMapKeyRef:
                  name: catalog-service-config
                  key: PricingService__TimeoutSeconds

            - name: PricingService__RetryCount
              valueFrom:
                configMapKeyRef:
                  name: catalog-service-config
                  key: PricingService__RetryCount
            - name: PricingService__RetryDelayMilliseconds
              valueFrom:
                configMapKeyRef:
                  name: catalog-service-config
                  key: PricingService__RetryDelayMilliseconds

            - name: CATALOG_DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: catalog-database-secret
                  key: postgres-database
            - name: CATALOG_DATABASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: catalog-database-secret
                  key: postgres-username

            - name: CATALOG_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-database-secret
                  key: postgres-password
            - name: ConnectionStrings__CatalogDatabase
              value: >-
                Host=catalog-service-db;
                Port=5432;
                Database=$(CATALOG_DATABASE_NAME);
                Username=$(CATALOG_DATABASE_USERNAME);
                Password=$(CATALOG_DATABASE_PASSWORD)

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi