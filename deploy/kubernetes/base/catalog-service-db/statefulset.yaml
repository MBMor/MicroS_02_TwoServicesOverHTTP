apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: catalog-service-db
  namespace: micros-02-qa
  labels:
    app.kubernetes.io/name: catalog-service-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: micros-02-two-services-over-http
spec:
  serviceName: catalog-service-db-headless
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: catalog-service-db
      app.kubernetes.io/component: database

  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-service-db
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: micros-02-two-services-over-http
    spec:
      terminationGracePeriodSeconds: 60

      containers:
        - name: postgres
          image: postgres:18
          imagePullPolicy: IfNotPresent

          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: catalog-database-secret
                  key: postgres-database

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: catalog-database-secret
                  key: postgres-username

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-database-secret
                  key: postgres-password

          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >
                  pg_isready
                  --host=127.0.0.1
                  --port=5432
                  --username="$POSTGRES_USER"
                  --dbname="$POSTGRES_DB"
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >
                  pg_isready
                  --host=127.0.0.1
                  --port=5432
                  --username="$POSTGRES_USER"
                  --dbname="$POSTGRES_DB"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - >
                  pg_isready
                  --host=127.0.0.1
                  --port=5432
                  --username="$POSTGRES_USER"
                  --dbname="$POSTGRES_DB"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql

  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: catalog-service-db
          app.kubernetes.io/component: database
          app.kubernetes.io/part-of: micros-02-two-services-over-http
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi