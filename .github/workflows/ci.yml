name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      SOLUTION_FILE: TwoServicesHttp.slnx
      DOTNET_VERSION: 10.0.x
      MINIMUM_LINE_COVERAGE: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Show .NET info
        run: dotnet --info

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_FILE }}

      - name: Check formatting
        run: dotnet format ${{ env.SOLUTION_FILE }} --verify-no-changes --no-restore --verbosity normal

      - name: Build
        run: dotnet build ${{ env.SOLUTION_FILE }} --configuration Release --no-restore

      - name: Test with coverage
        run: |
          dotnet test ${{ env.SOLUTION_FILE }} \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory TestResults

      - name: Generate coverage report
        run: |
          dotnet reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:"coveragereport" \
            -reporttypes:"Html;HtmlSummary;Cobertura;MarkdownSummaryGithub" \
            -assemblyfilters:"+CatalogService.*;+PricingService.*;-*.Tests.*" \
            -classfilters:"-Microsoft.AspNetCore.OpenApi.Generated.*" \
            -filefilters:"-**/obj/**;-**/*.g.cs;-**/*.generated.cs;-**/*SourceGenerators*"

      - name: Add coverage summary to job summary
        run: cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Check coverage threshold
        shell: pwsh
        run: |
          ./scripts/check-coverage.ps1 `
            -CoverageFile "coveragereport/Cobertura.xml" `
            -MinimumLineCoverage "${{ env.MINIMUM_LINE_COVERAGE }}"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coveragereport

      - name: Upload raw coverage files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raw-coverage-files
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  kubernetes-kind-smoke-test:
    name: Kubernetes kind smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build-and-test

    env:
      KIND_VERSION: v0.32.0
      KIND_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54

      KIND_CLUSTER_NAME: micros-02-ci
      KUBERNETES_NAMESPACE: micros-02-qa

      CATALOG_IMAGE: micros-02/catalog-service:1.0.0
      PRICING_IMAGE: micros-02/pricing-service:1.0.0
      MIGRATIONS_IMAGE: micros-02/ef-migrations:1.0.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show Docker version
        run: docker --version

      - name: Install kind
        run: |
          curl \
            --fail \
            --show-error \
            --location \
            --output kind \
            "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"

          echo "${KIND_SHA256}  kind" | sha256sum --check -

          chmod +x kind
          sudo mv kind /usr/local/bin/kind

          kind version

      - name: Show kubectl version
        run: kubectl version --client

      - name: Create kind cluster
        run: |
          kind create cluster \
            --name "${KIND_CLUSTER_NAME}" \
            --wait 120s

      - name: Show Kubernetes cluster
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: Build Catalog Service image
        run: |
          docker build \
            --file src/CatalogService/CatalogService.Api/Dockerfile \
            --tag "${CATALOG_IMAGE}" \
            .

      - name: Build Pricing Service image
        run: |
          docker build \
            --file src/PricingService/PricingService.Api/Dockerfile \
            --tag "${PRICING_IMAGE}" \
            .

      - name: Build EF migrations image
        run: |
          docker build \
            --file deploy/kubernetes/migrations/Dockerfile \
            --tag "${MIGRATIONS_IMAGE}" \
            .

      - name: Load application images into kind
        run: |
          kind load docker-image \
            --name "${KIND_CLUSTER_NAME}" \
            "${CATALOG_IMAGE}" \
            "${PRICING_IMAGE}" \
            "${MIGRATIONS_IMAGE}"

      - name: Verify images in kind
        run: |
          docker exec \
            "${KIND_CLUSTER_NAME}-control-plane" \
            crictl images

      - name: Create Kubernetes namespace
        run: |
          kubectl apply \
            -f deploy/kubernetes/base/namespace.yaml

      - name: Create CI database Secrets
        run: |
          kubectl create secret generic catalog-database-secret \
            --namespace "${KUBERNETES_NAMESPACE}" \
            --from-literal=postgres-database=catalog_service \
            --from-literal=postgres-username=catalog_user \
            --from-literal=postgres-password=catalog_ci_password

          kubectl create secret generic pricing-database-secret \
            --namespace "${KUBERNETES_NAMESPACE}" \
            --from-literal=postgres-database=pricing_service \
            --from-literal=postgres-username=pricing_user \
            --from-literal=postgres-password=pricing_ci_password

      - name: Deploy PostgreSQL databases
        run: |
          kubectl apply \
            -f deploy/kubernetes/base/catalog-service-db/

          kubectl apply \
            -f deploy/kubernetes/base/pricing-service-db/

      - name: Wait for PostgreSQL databases
        run: |
          kubectl wait \
            --for=condition=Ready \
            pod/catalog-service-db-0 \
            --namespace "${KUBERNETES_NAMESPACE}" \
            --timeout=180s

          kubectl wait \
            --for=condition=Ready \
            pod/pricing-service-db-0 \
            --namespace "${KUBERNETES_NAMESPACE}" \
            --timeout=180s

      - name: Apply application configuration and Services
        run: |
          kubectl apply \
            -f deploy/kubernetes/base/catalog-service/configmap.yaml

          kubectl apply \
            -f deploy/kubernetes/base/catalog-service/service.yaml

          kubectl apply \
            -f deploy/kubernetes/base/pricing-service/configmap.yaml

          kubectl apply \
            -f deploy/kubernetes/base/pricing-service/service.yaml

      - name: Run EF Core migration Jobs
        run: |
          kubectl apply \
            -f deploy/kubernetes/base/migrations/pricing-migration-job.yaml

          kubectl apply \
            -f deploy/kubernetes/base/migrations/catalog-migration-job.yaml

          kubectl wait \
            --for=condition=Complete \
            job/pricing-database-migration \
            --namespace "${KUBERNETES_NAMESPACE}" \
            --timeout=180s

          kubectl wait \
            --for=condition=Complete \
            job/catalog-database-migration \
            --namespace "${KUBERNETES_NAMESPACE}" \
            --timeout=180s

      - name: Deploy APIs
        run: |
          kubectl apply \
            -f deploy/kubernetes/base/pricing-service/deployment.yaml

          kubectl apply \
            -f deploy/kubernetes/base/catalog-service/deployment.yaml

      - name: Wait for API rollouts
        run: |
          kubectl rollout status \
            deployment/pricing-service \
            --namespace "${KUBERNETES_NAMESPACE}" \
            --timeout=180s

          kubectl rollout status \
            deployment/catalog-service \
            --namespace "${KUBERNETES_NAMESPACE}" \
            --timeout=180s

      - name: Run Kubernetes smoke test
        env:
          NAMESPACE: micros-02-qa
        run: |
          ./scripts/kubernetes/ci-kind-smoke.sh

      - name: Show Kubernetes diagnostics
        if: always()
        run: |
          echo "=== Nodes ==="
          kubectl get nodes -o wide || true

          echo
          echo "=== Pods ==="
          kubectl get pods \
            --namespace "${KUBERNETES_NAMESPACE}" \
            -o wide || true

          echo
          echo "=== Deployments ==="
          kubectl get deployments \
            --namespace "${KUBERNETES_NAMESPACE}" \
            -o wide || true

          echo
          echo "=== StatefulSets ==="
          kubectl get statefulsets \
            --namespace "${KUBERNETES_NAMESPACE}" \
            -o wide || true

          echo
          echo "=== Jobs ==="
          kubectl get jobs \
            --namespace "${KUBERNETES_NAMESPACE}" \
            -o wide || true

          echo
          echo "=== Services ==="
          kubectl get services \
            --namespace "${KUBERNETES_NAMESPACE}" \
            -o wide || true

          echo
          echo "=== EndpointSlices ==="
          kubectl get endpointslices \
            --namespace "${KUBERNETES_NAMESPACE}" \
            -o wide || true

          echo
          echo "=== Events ==="
          kubectl get events \
            --namespace "${KUBERNETES_NAMESPACE}" \
            --sort-by=.metadata.creationTimestamp || true

      - name: Show failed Pod descriptions and logs
        if: failure()
        run: |
          for pod in $(
            kubectl get pods \
              --namespace "${KUBERNETES_NAMESPACE}" \
              -o jsonpath='{.items[*].metadata.name}' \
              2>/dev/null
          ); do
            echo
            echo "============================================================"
            echo "Pod: ${pod}"
            echo "============================================================"

            kubectl describe pod \
              "${pod}" \
              --namespace "${KUBERNETES_NAMESPACE}" \
              || true

            kubectl logs \
              "${pod}" \
              --namespace "${KUBERNETES_NAMESPACE}" \
              --all-containers=true \
              --tail=500 \
              || true
          done

      - name: Delete kind cluster
        if: always()
        run: |
          kind delete cluster \
            --name "${KIND_CLUSTER_NAME}"

  docker-security-scan:
    name: Docker image security scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test

    env:
      CATALOG_IMAGE: micros-02-catalog-service-api:ci
      PRICING_IMAGE: micros-02-pricing-service-api:ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Catalog Service Docker image
        run: |
          docker build \
          --pull \
          --file src/CatalogService/CatalogService.Api/Dockerfile \
          --tag ${{ env.CATALOG_IMAGE }} \
          .

      - name: Build Pricing Service Docker image
        run: |
          docker build \
          --pull \
          --file src/PricingService/PricingService.Api/Dockerfile \
          --tag ${{ env.PRICING_IMAGE }} \
          .

      - name: Scan Catalog Service Docker image
        id: catalog-scan
        uses: anchore/scan-action@v7.4.0
        with:
          image: ${{ env.CATALOG_IMAGE }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: sarif
          output-file: catalog-service-grype.sarif

      - name: Scan Pricing Service Docker image
        id: pricing-scan
        uses: anchore/scan-action@v7.4.0
        with:
          image: ${{ env.PRICING_IMAGE }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: sarif
          output-file: pricing-service-grype.sarif

      - name: Create SBOM output directory
        run: mkdir -p sbom

      - name: Generate Catalog Service SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.CATALOG_IMAGE }}
          format: spdx-json
          output-file: sbom/catalog-service.spdx.json
          upload-artifact: false

      - name: Generate Pricing Service SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.PRICING_IMAGE }}
          format: spdx-json
          output-file: sbom/pricing-service.spdx.json
          upload-artifact: false

      - name: Upload Catalog Service scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catalog-service-vulnerability-scan
          path: catalog-service-grype.sarif
          if-no-files-found: warn

      - name: Upload Pricing Service scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pricing-service-vulnerability-scan
          path: pricing-service-grype.sarif
          if-no-files-found: warn

      - name: Upload Docker image SBOMs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-image-sboms
          path: sbom/*.spdx.json
          if-no-files-found: warn

  docker-compose-smoke-test:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-test

    env:
      COMPOSE_PROJECT_NAME: twoservicesoverhttp-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Start Docker Compose stack
        run: |
          docker compose up \
            --build \
            --wait \
            --wait-timeout 180

      - name: Show Docker Compose status
        if: always()
        run: docker compose ps

      - name: Check Catalog Service readiness endpoint
        run: curl --fail --show-error --silent http://localhost:5101/health/ready

      - name: Check Pricing Service readiness endpoint
        run: curl --fail --show-error --silent http://localhost:5102/health/ready

      - name: Show Docker Compose logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans